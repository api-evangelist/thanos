openapi: 3.2.0
info:
  title: Thanos Receive Remote Write API
  description: The Thanos Receive HTTP API implements the Prometheus Remote Write protocol to accept metrics pushed from Prometheus instances. It stores received metrics in a local TSDB and exposes health, readiness, and metrics endpoints for operational monitoring. Receive supports multi-tenancy via hashring-based routing and can replicate data across multiple Receive instances.
  version: 0.35.0
  contact:
    name: Thanos Community
    url: https://thanos.io/
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: http://localhost:10902
  description: Default Thanos Receive HTTP endpoint
tags:
- name: Remote Write
  description: Prometheus Remote Write ingestion endpoint.
paths:
  /api/v1/receive:
    post:
      operationId: remoteWrite
      summary: Thanos Ingest Metrics via Prometheus Remote Write
      description: Accepts Prometheus Remote Write requests containing time series data. The request body must be a Snappy-compressed protobuf-encoded WriteRequest. Multi-tenancy is supported via the THANOS-TENANT HTTP header. Requests may be forwarded to other Receive instances based on hashring routing configuration.
      tags:
      - Remote Write
      parameters:
      - name: THANOS-TENANT
        in: header
        required: false
        description: Optional tenant identifier for multi-tenant deployments. Determines which tenant's TSDB the data is written to.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema:
              type: string
              format: binary
              description: Snappy-compressed protobuf-encoded Prometheus WriteRequest containing time series samples.
      responses:
        '204':
          description: Metrics ingested successfully
        '400':
          description: Invalid request format or content
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Internal error during ingestion
          content:
            text/plain:
              schema:
                type: string
        '503':
          description: Receive is unavailable or overloaded
          content:
            text/plain:
              schema:
                type: string
externalDocs:
  description: Thanos Receive Documentation
  url: https://thanos.io/tip/components/receive.md/
