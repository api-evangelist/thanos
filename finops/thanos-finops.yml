specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Thanos
providerId: thanos
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - FinOps
  - FOCUS
  - Observability
  - Open Source
description: >-
  FOCUS-aligned FinOps for Thanos: Thanos itself is free Apache 2.0 software; the FinOps surface is the
  underlying object storage (S3 / GCS / Azure Blob), compute, and egress that operators incur when running
  Thanos as long-term storage for Prometheus metrics.
sources:
  - https://thanos.io/
  - https://thanos.io/tip/operating/cross-cluster-tls-communication.md/
  - https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Thanos contributors (CNCF)
serviceCategory: Observability
billingModel:
  pricingCategory: Open Source
  billingFrequency: On-Demand
  billingCurrency: USD
  chargeCategories:
    - Usage
focusColumns:
  ServiceName: Thanos
  ServiceCategory: Observability
  ProviderName: Thanos
  PublisherName: Thanos contributors (CNCF)
  BillingCurrency: USD
meters:
  - name: object_storage_bytes
    unit: GB-month
    aggregation: avg
    dimensions:
      - storage_class
      - retention_tier
  - name: object_storage_requests
    unit: request
    aggregation: sum
    dimensions:
      - operation
      - component
  - name: query_compute_hours
    unit: instance-hour
    aggregation: sum
    dimensions:
      - component
  - name: cross_az_egress
    unit: GB
    aggregation: sum
    dimensions:
      - direction
principles:
  - name: Visibility
    description: Thanos itself emits Prometheus metrics for storage requests, blocks, and query latency;
      pair these with the cloud object-store provider's billing export to attribute spend.
  - name: Allocation
    description: Tag Thanos components by team / environment / tenant in the cloud where they run so object-storage
      and compute spend is allocable in FOCUS-aligned exports.
  - name: Optimization
    description: Right-size retention, enable downsampling (5m/1h) for older data, configure storage classes
      / tiering on the object store, tune Compactor cadence, and place Querier near data to reduce egress.
  - name: Accountability
    description: Observability platform team owns Thanos infra spend and reviews per-tenant cardinality
      and retention against an agreed budget.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
