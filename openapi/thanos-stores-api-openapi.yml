openapi: 3.2.0
info:
  title: Thanos Query Stores API
  description: The Thanos Query API provides a Prometheus-compatible HTTP API for querying metrics across multiple Prometheus servers and long-term storage backends. Thanos Query implements the full Prometheus v1 API surface, enabling a global query view with deduplication across replicated series.
  version: 0.35.0
  contact:
    name: Thanos Community
    url: https://thanos.io/
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: http://localhost:9090
  description: Default Thanos Query HTTP endpoint
tags:
- name: Stores
paths:
  /api/v1/stores:
    get:
      operationId: getStores
      summary: Get Connected Store Information
      description: Returns information about all connected Thanos store endpoints including their type, labels, min/max time range, and last health check status. This is a Thanos-specific endpoint not found in vanilla Prometheus.
      tags:
      - Stores
      responses:
        '200':
          description: Successful stores response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoresResponse'
components:
  schemas:
    StoreInfo:
      type: object
      properties:
        name:
          type: string
          description: Store endpoint name or address
        lastCheck:
          type: string
          format: date-time
          description: Timestamp of last health check
        lastError:
          type:
          - string
          - 'null'
          description: Last error from the store, null if healthy
        labelSets:
          type: array
          items:
            type: object
            additionalProperties:
              type: string
          description: External labels advertised by the store
        minTime:
          type: integer
          format: int64
          description: Minimum time in milliseconds the store has data for
        maxTime:
          type: integer
          format: int64
          description: Maximum time in milliseconds the store has data for
        storeType:
          type: string
          description: Type of store component
          enum:
          - sidecar
          - store
          - rule
          - receive
          - debug
          - unknown
    StoresResponse:
      type: object
      required:
      - status
      - data
      properties:
        status:
          type: string
          enum:
          - success
        data:
          type: array
          items:
            $ref: '#/components/schemas/StoreInfo'
externalDocs:
  description: Thanos Documentation
  url: https://thanos.io/tip/components/query.md/
