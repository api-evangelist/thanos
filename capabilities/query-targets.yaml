naftiko: 1.0.0-alpha2
info:
  label: Thanos Query API — Targets
  description: 'Thanos Query API — Targets. 1 operations. Lead operation: Get Current Target Discovery. Self-contained Naftiko
    capability covering one Thanos business surface.'
  tags:
  - Thanos
  - Targets
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    THANOS_API_KEY: THANOS_API_KEY
capability:
  consumes:
  - type: http
    namespace: query-targets
    baseUri: http://localhost:9090
    description: Thanos Query API — Targets business capability. Self-contained, no shared references.
    resources:
    - name: api-v1-targets
      path: /api/v1/targets
      operations:
      - name: gettargets
        method: GET
        description: Get Current Target Discovery
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: state
          in: query
          type: string
          description: Filter targets by state. Can be active, dropped, or any.
  exposes:
  - type: rest
    namespace: query-targets-rest
    port: 8080
    description: REST adapter for Thanos Query API — Targets. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/api/v1/targets
      name: api-v1-targets
      description: REST surface for api-v1-targets.
      operations:
      - method: GET
        name: gettargets
        description: Get Current Target Discovery
        call: query-targets.gettargets
        with:
          state: rest.state
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: query-targets-mcp
    port: 9090
    transport: http
    description: MCP adapter for Thanos Query API — Targets. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: get-current-target-discovery
      description: Get Current Target Discovery
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: query-targets.gettargets
      with:
        state: tools.state
      outputParameters:
      - type: object
        mapping: $.
