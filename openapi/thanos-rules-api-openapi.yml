openapi: 3.2.0
info:
  title: Thanos Rules API
  version: 0.35.0
  contact:
    name: Thanos Community
    url: https://thanos.io/
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  description: 'Operations tagged Rules across 2 of this provider''s published API definitions: thanos-query-api.yml, thanos-ruler-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: http://localhost:9090
  description: Default Thanos Query HTTP endpoint
- url: http://localhost:10902
  description: Default Thanos Ruler HTTP endpoint
tags:
- name: Rules
paths:
  /api/v1/rules:
    get:
      operationId: getRules
      summary: Get Alerting and Recording Rules
      description: Returns a list of alerting and recording rules that are currently loaded across connected Thanos Ruler and Prometheus instances.
      tags:
      - Rules
      parameters:
      - name: type
        in: query
        required: false
        description: Filter by rule type
        schema:
          type: string
          enum:
          - alert
          - record
      - name: match[]
        in: query
        required: false
        description: Filter rules by label matchers
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      - $ref: '#/components/parameters/partial_response'
      responses:
        '200':
          description: Successful rules response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulesResponse'
    servers:
    - url: http://localhost:9090
      description: Default Thanos Query HTTP endpoint
  /api/v1/alerts:
    get:
      operationId: getAlerts
      summary: Get Active Alerts
      description: Returns a list of all active alerts across connected Thanos Ruler and Prometheus instances.
      tags:
      - Rules
      parameters:
      - $ref: '#/components/parameters/partial_response'
      responses:
        '200':
          description: Successful alerts response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertsResponse'
    servers:
    - url: http://localhost:9090
      description: Default Thanos Query HTTP endpoint
components:
  schemas:
    RecordingRule:
      type: object
      properties:
        type:
          type: string
          enum:
          - recording
        name:
          type: string
        query:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        health:
          type: string
        lastError:
          type: string
        lastEvaluation:
          type: string
          format: date-time
        evaluationTime:
          type: number
          format: double
    Alert:
      type: object
      properties:
        labels:
          type: object
          additionalProperties:
            type: string
        annotations:
          type: object
          additionalProperties:
            type: string
        state:
          type: string
          enum:
          - firing
          - pending
        activeAt:
          type: string
          format: date-time
        value:
          type: string
    RulesResponse:
      type: object
      required:
      - status
      - data
      properties:
        status:
          type: string
          enum:
          - success
        data:
          type: object
          properties:
            groups:
              type: array
              items:
                $ref: '#/components/schemas/RuleGroup'
    AlertsResponse:
      type: object
      required:
      - status
      - data
      properties:
        status:
          type: string
          enum:
          - success
        data:
          type: object
          properties:
            alerts:
              type: array
              items:
                $ref: '#/components/schemas/Alert'
    RuleGroup:
      type: object
      properties:
        name:
          type: string
        file:
          type: string
        interval:
          type: number
          format: double
        rules:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/AlertingRule'
            - $ref: '#/components/schemas/RecordingRule'
        partialResponseStrategy:
          type: string
          description: Thanos-specific field for partial response handling
    AlertingRule:
      type: object
      properties:
        type:
          type: string
          enum:
          - alerting
        name:
          type: string
        query:
          type: string
        duration:
          type: number
          format: double
        labels:
          type: object
          additionalProperties:
            type: string
        annotations:
          type: object
          additionalProperties:
            type: string
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/Alert'
        health:
          type: string
        lastError:
          type: string
        lastEvaluation:
          type: string
          format: date-time
        evaluationTime:
          type: number
          format: double
        state:
          type: string
          enum:
          - firing
          - pending
          - inactive
    RecordingRule_2:
      type: object
      description: A recording rule that precomputes a PromQL expression and stores the result.
      properties:
        type:
          type: string
          enum:
          - recording
        name:
          type: string
          description: Metric name for the recorded result.
        query:
          type: string
          description: PromQL expression to evaluate and record.
        labels:
          type: object
          additionalProperties:
            type: string
          description: Labels to attach to the recorded metric.
        health:
          type: string
          description: Current health status of the rule.
        lastError:
          type: string
          description: Last error encountered during rule evaluation.
        lastEvaluation:
          type: string
          format: date-time
          description: Timestamp of the last rule evaluation.
        evaluationTime:
          type: number
          format: double
          description: Time taken for the last evaluation in seconds.
    Alert_2:
      type: object
      description: An active alert instance produced by an alerting rule.
      properties:
        labels:
          type: object
          additionalProperties:
            type: string
          description: Labels identifying the alert instance.
        annotations:
          type: object
          additionalProperties:
            type: string
          description: Annotations providing additional context for the alert.
        state:
          type: string
          enum:
          - firing
          - pending
          description: Current state of the alert.
        activeAt:
          type: string
          format: date-time
          description: Timestamp when the alert became active.
        value:
          type: string
          description: The value of the PromQL expression at the time of the last evaluation.
    ErrorResponse:
      type: object
      description: Error response returned when a request cannot be processed.
      required:
      - status
      - error
      properties:
        status:
          type: string
          enum:
          - error
        errorType:
          type: string
          description: Category of error.
        error:
          type: string
          description: Human-readable error message.
    RulesResponse_2:
      type: object
      description: Response containing all evaluated rule groups.
      properties:
        status:
          type: string
          enum:
          - success
          - error
        data:
          type: object
          properties:
            groups:
              type: array
              description: List of rule groups loaded by the Ruler.
              items:
                $ref: '#/components/schemas/RuleGroup_2'
    RuleGroup_2:
      type: object
      description: A named collection of alerting or recording rules evaluated together.
      properties:
        name:
          type: string
          description: Name of the rule group.
        file:
          type: string
          description: Configuration file where this rule group is defined.
        interval:
          type: number
          format: double
          description: Evaluation interval for the group in seconds.
        rules:
          type: array
          description: List of rules in the group.
          items:
            oneOf:
            - $ref: '#/components/schemas/AlertingRule_2'
            - $ref: '#/components/schemas/RecordingRule_2'
        partialResponseStrategy:
          type: string
          description: Thanos-specific strategy for handling partial responses when querying through the Thanos Query layer.
          enum:
          - abort
          - warn
    AlertingRule_2:
      type: object
      description: An alerting rule that fires alerts when its PromQL condition is true.
      properties:
        type:
          type: string
          enum:
          - alerting
        name:
          type: string
          description: Alert name.
        query:
          type: string
          description: PromQL expression evaluated to determine if the alert should fire.
        duration:
          type: number
          format: double
          description: Time in seconds the condition must be true before the alert fires.
        labels:
          type: object
          additionalProperties:
            type: string
          description: Labels to attach to the alert.
        annotations:
          type: object
          additionalProperties:
            type: string
          description: Annotations to attach to the alert.
        alerts:
          type: array
          description: Currently active instances of this alert.
          items:
            $ref: '#/components/schemas/Alert_2'
        health:
          type: string
          description: Current health status of the rule.
        lastError:
          type: string
          description: Last error encountered during rule evaluation.
        lastEvaluation:
          type: string
          format: date-time
          description: Timestamp of the last rule evaluation.
        evaluationTime:
          type: number
          format: double
          description: Time taken for the last evaluation in seconds.
        state:
          type: string
          enum:
          - firing
          - pending
          - inactive
          description: Current state of the alerting rule.
  parameters:
    partial_response:
      name: partial_response
      in: query
      required: false
      description: If true, enables partial response. If a store is unavailable, partial data will be returned with a warning instead of failing the query.
      schema:
        type: boolean
        default: false
x-refined-from:
- thanos-query-api.yml
- thanos-ruler-openapi.yml
