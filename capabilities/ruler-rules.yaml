naftiko: 1.0.0-alpha2
info:
  label: Thanos Ruler API — Rules
  description: 'Thanos Ruler API — Rules. 1 operations. Lead operation: Thanos List Alerting and Recording Rules. Self-contained
    Naftiko capability covering one Thanos business surface.'
  tags:
  - Thanos
  - Rules
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    THANOS_API_KEY: THANOS_API_KEY
capability:
  consumes:
  - type: http
    namespace: ruler-rules
    baseUri: http://localhost:10902
    description: Thanos Ruler API — Rules business capability. Self-contained, no shared references.
    resources:
    - name: api-v1-rules
      path: /api/v1/rules
      operations:
      - name: getrulerrules
        method: GET
        description: Thanos List Alerting and Recording Rules
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: type
          in: query
          type: string
          description: Filter rules by type.
        - name: match[]
          in: query
          type: array
          description: Filter rules by label matchers. Only rules whose labels match all provided matchers will be returned.
  exposes:
  - type: rest
    namespace: ruler-rules-rest
    port: 8080
    description: REST adapter for Thanos Ruler API — Rules. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/api/v1/rules
      name: api-v1-rules
      description: REST surface for api-v1-rules.
      operations:
      - method: GET
        name: getrulerrules
        description: Thanos List Alerting and Recording Rules
        call: ruler-rules.getrulerrules
        with:
          type: rest.type
          match[]: rest.match[]
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: ruler-rules-mcp
    port: 9090
    transport: http
    description: MCP adapter for Thanos Ruler API — Rules. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: thanos-list-alerting-and-recording
      description: Thanos List Alerting and Recording Rules
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: ruler-rules.getrulerrules
      with:
        type: tools.type
        match[]: tools.match[]
      outputParameters:
      - type: object
        mapping: $.
