openapi: 3.2.0
info:
  title: Thanos Ruler Alerts API
  description: The Thanos Ruler HTTP API exposes Prometheus-compatible endpoints for querying alerting and recording rules evaluated by the Ruler component. Ruler evaluates rules against the Thanos Query API for a global view, fires alerts to Alertmanager, and optionally uploads rule evaluation blocks to object storage for long-term storage.
  version: 0.35.0
  contact:
    name: Thanos Community
    url: https://thanos.io/
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: http://localhost:10902
  description: Default Thanos Ruler HTTP endpoint
tags:
- name: Alerts
  description: Endpoints for querying currently active alerts.
paths:
  /api/v1/alerts:
    get:
      operationId: getRulerAlerts
      summary: Thanos List Active Alerts
      description: Returns all currently active (firing or pending) alerts produced by the Ruler's alerting rule evaluations. Compatible with the Prometheus alerts API.
      tags:
      - Alerts
      responses:
        '200':
          description: List of active alerts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertsResponse'
components:
  schemas:
    Alert:
      type: object
      description: An active alert instance produced by an alerting rule.
      properties:
        labels:
          type: object
          additionalProperties:
            type: string
          description: Labels identifying the alert instance.
        annotations:
          type: object
          additionalProperties:
            type: string
          description: Annotations providing additional context for the alert.
        state:
          type: string
          enum:
          - firing
          - pending
          description: Current state of the alert.
        activeAt:
          type: string
          format: date-time
          description: Timestamp when the alert became active.
        value:
          type: string
          description: The value of the PromQL expression at the time of the last evaluation.
    AlertsResponse:
      type: object
      description: Response containing currently active alerts.
      properties:
        status:
          type: string
          enum:
          - success
          - error
        data:
          type: object
          properties:
            alerts:
              type: array
              description: List of currently active alerts.
              items:
                $ref: '#/components/schemas/Alert'
externalDocs:
  description: Thanos Ruler Documentation
  url: https://thanos.io/tip/components/rule.md/
