openapi: 3.2.0
info:
  title: Thanos Metrics API
  version: 0.35.0
  contact:
    name: Thanos Community
    url: https://thanos.io/
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  description: 'Operations tagged Metrics across 3 of this provider''s published API definitions: thanos-compact-openapi.yml, thanos-receive-openapi.yml, thanos-ruler-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: http://localhost:10902
  description: Default Thanos Compact HTTP endpoint
tags:
- name: Metrics
  description: Prometheus metrics for monitoring Compactor performance.
paths:
  /metrics:
    get:
      operationId: getCompactMetrics
      summary: Thanos Prometheus Metrics
      description: Exposes internal Compactor metrics in Prometheus text exposition format. Includes metrics for compaction duration, block counts by resolution, retention enforcement operations, downsampling progress, and object storage operation rates.
      tags:
      - Metrics
      responses:
        '200':
          description: Prometheus metrics in text format
          content:
            text/plain:
              schema:
                type: string
    servers:
    - url: http://localhost:10902
      description: Default Thanos Compact HTTP endpoint
x-refined-from:
- thanos-compact-openapi.yml
- thanos-receive-openapi.yml
- thanos-ruler-openapi.yml
