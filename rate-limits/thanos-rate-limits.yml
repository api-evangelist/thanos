description: >-
  Thanos is self-hosted open-source software, not a hosted API service; query and ingest throughput are
  bounded only by the operator's deployment (compute, object storage backend, replication and downsampling
  settings). The Thanos project itself imposes no central rate limits.
sources:
  - https://thanos.io/
  - https://thanos.io/tip/components/query/
notes: >-
  No central provider-imposed rate limits exist. Throughput is a self-hosting capacity concern.
responseCodes: {}
limits:
  - name: Self-Hosted Query / Ingest
    scope: deployment
    metric: varies
    limit: bounded by self-hosted compute and object storage backend
policies:
  - name: Self-Hosted Capacity
    description: Operators size Querier, Store Gateway, Compactor, and Receiver components and tune object
      storage to meet their workload; Thanos itself does not throttle externally.
