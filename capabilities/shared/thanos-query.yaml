naftiko: "1.0.0-alpha1"

info:
  label: "Thanos Query API"
  description: "Prometheus-compatible HTTP API for querying metrics across multiple Prometheus servers and long-term storage backends with deduplication."
  tags:
    - Thanos
    - Query
    - PromQL
    - Metrics
    - Prometheus
    - Observability
  created: "2026-05-03"
  modified: "2026-05-03"

capability:
  consumes:
    - type: http
      namespace: thanos-query
      baseUri: http://localhost:9090
      description: "Thanos Query HTTP API — Prometheus-compatible query interface"
      resources:
        - name: instant-query
          path: /api/v1/query
          description: "Instant PromQL queries"
          operations:
            - name: instant-query
              method: GET
              description: "Evaluate a PromQL expression at a single point in time"
              inputParameters:
                - name: query
                  in: query
                  type: string
                  required: true
                  description: "PromQL query expression"
                - name: time
                  in: query
                  type: string
                  required: false
                  description: "Evaluation timestamp (RFC3339 or Unix)"
                - name: dedup
                  in: query
                  type: boolean
                  required: false
                  description: "Enable deduplication (default: true)"
                - name: partial_response
                  in: query
                  type: boolean
                  required: false
                  description: "Enable partial response (default: false)"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: range-query
          path: /api/v1/query_range
          description: "Range PromQL queries"
          operations:
            - name: range-query
              method: GET
              description: "Evaluate a PromQL expression over a time range"
              inputParameters:
                - name: query
                  in: query
                  type: string
                  required: true
                  description: "PromQL query expression"
                - name: start
                  in: query
                  type: string
                  required: true
                  description: "Start timestamp"
                - name: end
                  in: query
                  type: string
                  required: true
                  description: "End timestamp"
                - name: step
                  in: query
                  type: string
                  required: true
                  description: "Step interval (e.g., 60s, 5m)"
                - name: dedup
                  in: query
                  type: boolean
                  required: false
                  description: "Enable deduplication"
                - name: max_source_resolution
                  in: query
                  type: string
                  required: false
                  description: "Max resolution: 0s, 5m, or 1h"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: series
          path: /api/v1/series
          description: "Series discovery"
          operations:
            - name: get-series
              method: GET
              description: "Find time series by label matchers"
              inputParameters:
                - name: "match[]"
                  in: query
                  type: array
                  required: true
                  description: "Label matchers"
                - name: start
                  in: query
                  type: string
                  required: false
                  description: "Start timestamp"
                - name: end
                  in: query
                  type: string
                  required: false
                  description: "End timestamp"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: labels
          path: /api/v1/labels
          description: "Label name discovery"
          operations:
            - name: get-labels
              method: GET
              description: "Get all label names"
              inputParameters:
                - name: start
                  in: query
                  type: string
                  required: false
                - name: end
                  in: query
                  type: string
                  required: false
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: stores
          path: /api/v1/stores
          description: "Connected store information"
          operations:
            - name: get-stores
              method: GET
              description: "Get information about connected Thanos store endpoints"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: alerts
          path: /api/v1/alerts
          description: "Active alerts"
          operations:
            - name: get-alerts
              method: GET
              description: "Get all active alerts"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: rules
          path: /api/v1/rules
          description: "Alerting and recording rules"
          operations:
            - name: get-rules
              method: GET
              description: "Get alerting and recording rules"
              inputParameters:
                - name: type
                  in: query
                  type: string
                  required: false
                  description: "Filter by rule type: alert or record"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: thanos-query-api
      resources:
        - path: /v1/query
          name: instant-query
          description: "Thanos instant query"
          operations:
            - method: GET
              name: instant-query
              description: "Execute an instant PromQL query"
              call: "thanos-query.instant-query"
              with:
                query: "rest.query"
                time: "rest.time"
                dedup: "rest.dedup"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/query-range
          name: range-query
          description: "Thanos range query"
          operations:
            - method: GET
              name: range-query
              description: "Execute a PromQL range query"
              call: "thanos-query.range-query"
              with:
                query: "rest.query"
                start: "rest.start"
                end: "rest.end"
                step: "rest.step"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/stores
          name: stores
          description: "Connected store endpoints"
          operations:
            - method: GET
              name: get-stores
              description: "Get connected store information"
              call: "thanos-query.get-stores"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: thanos-query-mcp
      transport: http
      tools:
        - name: instant-query
          description: "Execute an instant PromQL query via Thanos"
          hints:
            readOnly: true
            openWorld: false
            idempotent: true
          call: "thanos-query.instant-query"
          with:
            query: "tools.query"
            time: "tools.time"
            dedup: "tools.dedup"
          outputParameters:
            - type: object
              mapping: "$."

        - name: range-query
          description: "Execute a PromQL range query via Thanos"
          hints:
            readOnly: true
            openWorld: false
            idempotent: true
          call: "thanos-query.range-query"
          with:
            query: "tools.query"
            start: "tools.start"
            end: "tools.end"
            step: "tools.step"
            dedup: "tools.dedup"
            max_source_resolution: "tools.max_source_resolution"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-series
          description: "Find time series matching label matchers"
          hints:
            readOnly: true
            openWorld: false
            idempotent: true
          call: "thanos-query.get-series"
          with:
            "match[]": "tools.matchers"
            start: "tools.start"
            end: "tools.end"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-labels
          description: "Get all available label names from Thanos"
          hints:
            readOnly: true
            openWorld: false
            idempotent: true
          call: "thanos-query.get-labels"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-stores
          description: "Get information about connected Thanos store endpoints"
          hints:
            readOnly: true
            openWorld: false
            idempotent: true
          call: "thanos-query.get-stores"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-alerts
          description: "Get all currently active alerts from Thanos"
          hints:
            readOnly: true
            openWorld: false
            idempotent: true
          call: "thanos-query.get-alerts"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-rules
          description: "Get alerting and recording rules from Thanos"
          hints:
            readOnly: true
            openWorld: false
            idempotent: true
          call: "thanos-query.get-rules"
          with:
            type: "tools.type"
          outputParameters:
            - type: object
              mapping: "$."
