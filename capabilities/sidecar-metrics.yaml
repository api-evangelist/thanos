naftiko: 1.0.0-alpha2
info:
  label: Thanos Sidecar API — Metrics
  description: 'Thanos Sidecar API — Metrics. 1 operations. Lead operation: Thanos Prometheus Metrics. Self-contained Naftiko
    capability covering one Thanos business surface.'
  tags:
  - Thanos
  - Metrics
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    THANOS_API_KEY: THANOS_API_KEY
capability:
  consumes:
  - type: http
    namespace: sidecar-metrics
    baseUri: http://localhost:10902
    description: Thanos Sidecar API — Metrics business capability. Self-contained, no shared references.
    resources:
    - name: metrics
      path: /metrics
      operations:
      - name: getsidecarmetrics
        method: GET
        description: Thanos Prometheus Metrics
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: sidecar-metrics-rest
    port: 8080
    description: REST adapter for Thanos Sidecar API — Metrics. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/metrics
      name: metrics
      description: REST surface for metrics.
      operations:
      - method: GET
        name: getsidecarmetrics
        description: Thanos Prometheus Metrics
        call: sidecar-metrics.getsidecarmetrics
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: sidecar-metrics-mcp
    port: 9090
    transport: http
    description: MCP adapter for Thanos Sidecar API — Metrics. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: thanos-prometheus-metrics
      description: Thanos Prometheus Metrics
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: sidecar-metrics.getsidecarmetrics
      outputParameters:
      - type: object
        mapping: $.
